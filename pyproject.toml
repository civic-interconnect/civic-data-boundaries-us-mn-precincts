# ============================================================
# pyproject.toml (ALL-PY-SRC-REPOS)
# ============================================================
# REQ: Python projects SHOULD include pyproject.toml as the single source of truth.
# WHY: Centralizes Python project configuration.

# ============================================================
# === SECTION 1: PROJECT IDENTITY ===
# ============================================================

[project]
name = "civic-data-boundaries-us-mn-precincts"
dynamic = ["version"]
description = "Minnesota precinct boundary layers"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Civic Interconnect", email = "info@civic-interconnect.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
keywords = [
    "civic",
    "gis",
    "geojson",
    "boundaries",
    "precincts",
    "US",
    "Minnesota",
]
dependencies = [
    "civic-lib-core",
    "geopandas",
    "PyYAML",
    "shapely",
    "typer",
]

[dependency-groups]
# WHY: Development dependencies used for repository maintenance and validation.
dev = [
    "prek",
    "pytest>=9",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
]

# WHY: Documentation dependencies are isolated from runtime dependencies.
docs = [
    "mkdocstrings[python]",
    "zensical",
]

[project.urls]
"Data (index.json)" = "https://raw.githubusercontent.com/civic-interconnect/civic-data-boundaries-us-mn-precincts/refs/heads/main/data-out/index.json"
"Data (manifest.json)" = "https://raw.githubusercontent.com/civic-interconnect/civic-data-boundaries-us-mn-precincts/refs/heads/main/data-out/manifest.json"
"Documentation" = "https://civic-interconnect.github.io/civic-data-boundaries-us-mn-precincts/"
"Homepage" = "https://github.com/civic-interconnect/civic-data-boundaries-us-mn-precincts"
"Issues" = "https://github.com/civic-interconnect/civic-data-boundaries-us-mn-precincts/issues"
"Source" = "https://github.com/civic-interconnect/civic-data-boundaries-us-mn-precincts"

[project.scripts]
civic-us-mn = "civic_data_boundaries_us_mn_precincts.cli.cli:main"

# ============================================================
# === SECTION 2: TOOL CONFIGURATION ===
# ============================================================

# === PYTEST (VERIFY LOGIC) ===

[tool.pytest.ini_options]
# WHY: Consistent test discovery and coverage visibility.
minversion = "9.0"
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=20 --cov-report=term-missing"

# === RUFF (PYTHON FORMATTING AND LINTING) ===

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# WHY: Evolve with Ruff's defaults; add rules only where the repository needs them.
extend-select = [
    # "D", # Require docstrings when desired.
]

[tool.ruff.lint.isort]
# WHY: Sort plain-import and from-import lines together within each section.
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
"src/**/_version.py" = ["ALL"]
"tests/**/*.py" = ["D", "B018"]
"notebooks/**/*.py" = [
    "D",
    "PLR1711",
    "RUF059",
]
"src/**/notebook.py" = [
    "B018",
    "D",
    "PLR1711",
    "RUF059",
]

[tool.ruff.lint.pydocstyle]
# WHY: Use Google docstring style when D rules are enabled.
convention = "google"

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all dependency groups defined by this repository by default.
default-groups = "all"

# WHY: Allow time for newly published releases to receive ecosystem scrutiny.
# CUSTOM: Should match `uv run prek update --freeze --cooldown-days 7`.
exclude-newer = "7 days"

# ============================================================
# === SECTION 3: BUILD SYSTEM ===
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY: Hatchling provides the package build backend.
# WHY: hatch-vcs derives the package version from Git tags.

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/civic_data_boundaries_us_mn_precincts/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/civic_data_boundaries_us_mn_precincts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data-config",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
